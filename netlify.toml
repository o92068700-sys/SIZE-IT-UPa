# Netlify build settings — the Git-integration deploys read this file.
[build]
  command = "npm run build"
  publish = "dist"

# Safety net if client-side routing is added later. Harmless today:
# the app is a single page, so unknown paths simply render index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
